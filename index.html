<!doctype html>
<!-- ============================================================
     index.html — STRUTTURA DELLA PWA OrangeTide (SPEC 7.2, 10.2, 11)
     ============================================================
     L'app ha una sola pagina HTML: il contenuto delle "pagine" (Dashboard,
     Storico, ...) viene disegnato dal JavaScript dentro <main id="page">,
     in base all'indirizzo (#dashboard, #storico, ...). Vedi js/app.js.

     Disposizione:
       - PC (schermo largo): menu laterale a sinistra + barra in alto;
       - telefono/tablet: barra in alto + barra di navigazione in basso.

     Librerie da CDN, con versione fissata (SPEC 10.2):
       Bootstrap 5.3.3        layout e componenti
       Bootstrap Icons 1.11.3 icone dei menu e dei riquadri
       Apache ECharts 5.5.1   grafici
       font Manrope           da Google Fonts
     ============================================================ -->
<html lang="it" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: usa tutto lo schermo dell'iPhone (anche sotto la "tacca") -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OrangeTide</title>
  <meta name="description" content="Contesto di mercato di Bitcoin su tre orizzonti">

  <!-- PWA: manifest (nome, icone, colori) e impostazioni per iPhone -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F7841A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OrangeTide">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Font Manrope (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

  <!-- Stili: Bootstrap, icone, poi i nostri (che hanno la precedenza) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==========================================================
       MENU LATERALE (solo PC): logo e pagine
       ========================================================== -->
  <aside class="ot-sidebar">
    <a class="ot-brand" href="#dashboard">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <span>Orange<b>Tide</b></span>
    </a>
    <nav class="ot-side-nav" id="nav-side" aria-label="Pagine"></nav>
    <div class="ot-side-footer">
      <span id="app-version"></span><br>
      Non è un consiglio finanziario
    </div>
  </aside>

  <!-- ==========================================================
       COLONNA PRINCIPALE: barra in alto, avvisi, pagina
       ========================================================== -->
  <div class="ot-shell">
    <header class="ot-topbar">
      <!-- Logo: solo su telefono/tablet (sul PC è nel menu laterale) -->
      <a class="ot-brand ot-brand-top" href="#dashboard">
        <img src="icons/icon.svg" alt="" width="30" height="30">
        <span>Orange<b>Tide</b></span>
      </a>
      <h1 class="ot-page-title" id="page-title"></h1>
      <div class="ot-topbar-actions">
        <span class="ot-chip d-none d-sm-inline-flex" id="data-date"></span>
        <button type="button" class="ot-round-button" id="theme-button" aria-label="Cambia tema"></button>
      </div>
    </header>

    <!-- AVVISI GLOBALI (token, dati vecchi, nuova versione: SPEC 11.6) -->
    <div id="banners"></div>

    <!-- CONTENUTO DELLA PAGINA CORRENTE (disegnato da app.js) -->
    <main class="ot-main" id="page"></main>
  </div>

  <!-- ==========================================================
       BARRA IN BASSO (telefono/tablet): pagine principali + "Altro"
       ========================================================== -->
  <nav class="ot-tabbar" aria-label="Navigazione">
    <div id="nav-bottom" class="ot-tabbar-items"></div>
    <div class="dropup" id="nav-more">
      <button class="ot-tab" id="nav-more-button" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-three-dots"></i><span>Altro</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" id="nav-more-menu"></ul>
    </div>
  </nav>

  <!-- ==========================================================
       SCRIPT: librerie, poi i nostri file nell'ordine richiesto
       (config -> data -> app -> widget; vedi js/app.js)
       ========================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/graphs.js"></script>
  <script src="js/info.js"></script>
</body>
</html>
